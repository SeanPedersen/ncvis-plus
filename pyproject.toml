[build-system]
requires = ["setuptools>=75", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ncvis-plus"
version = "0.1.0"
description = "Noise-contrastive data visualization: t-SNE-level local and global structure, 3x faster at half the memory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "lib/hnswlib/LICENSE", "lib/pcg-cpp/LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "rinnd>=0.4.4"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "scikit-learn>=1.5", "scipy>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
